[project]
name = "badger-mini-agent"
version = "0.1.0"
description = "Team agent for Efficient Coder: mini-swe-agent run as a Harbor external agent on Terminal-Bench 2.0"
requires-python = ">=3.12"
dependencies = [
    "harbor>=0.13",
    # Pinned: harbor_agent.py subclasses DefaultAgent/LitellmModel and relies on their internals.
    "mini-swe-agent==2.4.6",
    "python-dotenv>=1.0",
    "pyyaml",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["badger_mini"]

[tool.setuptools.package-data]
badger_mini = ["config/*.yaml"]
